name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]   # buyers use Mac and Windows
        python: ["3.10", "3.12"]
        exclude:
          - os: macos-latest      # GitHub rarely has macOS arm64 runners for 3.10 (job "not acquired"); Mac buyers install 3.12
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Skill checks (p5.brush download + SHA-256 + patch, use cases, templates)
        run: python tests/test_new_project.py
      - name: Install (redraw-video)
        run: python -m pip install -r requirements.txt
      - name: Doctor (downloads and loads both MediaPipe models, checks p5.brush)
        run: python usecases/redraw-video/drawify.py --doctor
      - name: Smoke test redraw-video (synthetic clip, both styles)
        run: python usecases/redraw-video/tests/smoke_test.py
